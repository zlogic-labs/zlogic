# OSS 版 CLI 的 macOS 构建 —— 只用公开仓自己的源码。
#
# 为什么它住在公开仓而不是私有仓：`-no-daemon` 那个二进制就是 crates.io 上 `cargo install
# zlogic` 装到的东西，源码 100% 在这个仓里。放在这里编有三个好处：
#
#   - **公开仓的 Actions 分钟免费**（标准 runner 对公开仓不计入额度），不烧私有仓的配额；
#   - 不占发版关键路径 —— 它只等自己的版本号 PR 合入，不用等私有仓那个 PR；
#   - 产物可追溯到公开仓的某个 run，比"闭源 CI 编出来的、声称等于公开源码"更可审计。
#
# **这个 workflow 里永远不要出现 secret。** 公开仓的 Actions context 拿得到 workflow 里
# 写的每一个 env 和每一个 input；签名私钥放进来是最坏的情况。同理不要 checkout 任何
# 私有仓 —— 这个二进制按定义不依赖闭源 crate，将来真加了私有 path 依赖，这里会响亮地
# 编译失败，那正是我们想要的失败方式。
#
# 手动触发（发版脚本会代劳）：
#   gh workflow run build-oss-cli.yml --ref main
#
# 产物名 zlogic-oss-macos-latest-{arch} 被 scripts/release/stages/build.mjs 按名下载。

name: Build OSS CLI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-oss-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oss-cli:
    name: OSS CLI (${{ matrix.artifact_arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # aarch64 原生、x86_64 交叉编译；两个条目并行，所以总时长取决于交叉编译那一条。
        # 换更大的 runner 要 GitHub Team/Enterprise，且不能用赠送额度 —— 见 README。
        include:
          - os: macos-latest
            artifact_arch: aarch64
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            artifact_arch: x86_64
            rust_target: x86_64-apple-darwin
    steps:
      # 不带 submodules: —— 这个仓没有 submodule，也不该有。
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # 默认的 `. -> target` 对这个仓就是对的：仓根**就是**那个 workspace。
      # （私有仓里同样的构建要指到 oss-target/，不在默认范围内，每次都是冷编译。）
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.rust_target }} -p zlogic

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zlogic-oss-macos-latest-${{ matrix.artifact_arch }}
          path: target/${{ matrix.rust_target }}/release/zlogic
          if-no-files-found: error
          retention-days: 14
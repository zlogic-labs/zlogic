[package]
name = "zlogic-tools"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tool definitions, the registry, and the built-in tools"
license.workspace = true

[lints]
workspace = true

[dependencies]
zlogic-protocol = { path = "../protocol" }
zlogic-objects = { path = "../objects" }
zlogic-task = { path = "../task" }
zlogic-credential = { path = "../credential" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "net"] }
zlogic-code-sitter = { path = "../code-sitter" }
ignore = "0.4"
globset = "0.4"
similar = "3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
mime = "0.3"
chrono.workspace = true
chrono-tz.workspace = true
calamine = "0.36.1"
csv = "1.4.0"
# `read_file`'s text-family fallback: non-UTF-8 (UTF-16 BOM / GB18030) is transcoded to UTF-8 on read.
encoding_rs = "0.8"
quick-xml = "0.42"
zip.workspace = true
tempfile.workspace = true
url = "2.5"
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
tokio = { version = "1.52", features = ["rt", "macros", "time", "net", "io-util"] }

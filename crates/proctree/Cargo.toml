[package]
name = "zlogic-proctree"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The one spawn path for child processes, so a process tree can always be stopped as a whole"
license.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["process", "time"] }
# `process-wrap` owns the Win32 job-object FFI, which this workspace forbids writing directly.
# The feature set is exactly what the two platforms need — job object on Windows, process
# group on Unix — so the process-session and tracing wrappers stay off.
process-wrap = { version = "10", default-features = false, features = [
    "tokio1",
    "creation-flags",
    "job-object",
    "kill-on-drop",
    "process-group",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

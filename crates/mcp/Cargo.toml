[package]
name = "zlogic-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "MCP: server definitions, the connection pool, and the tool catalog that acts as a ToolSource"
license.workspace = true

[lints]
workspace = true

[features]
test-server = []

[[bin]]
name = "stdio_zlogic"
path = "src/bin/stdio_zlogic.rs"
required-features = ["test-server"]

[dependencies]
zlogic-protocol = { path = "../protocol" }
zlogic-objects = { path = "../objects" }
zlogic-tools = { path = "../tools" }
zlogic-proctree = { path = "../proctree" }
zlogic-config = { path = "../config" }
zlogic-credential = { path = "../credential" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "time", "sync"] }
# Cached tool lists record when they were fetched; the TTL is compared against it.
chrono.workspace = true
# The pool key is a hash of the resolved launch parameters — see `resolve.rs`.
sha2.workspace = true
base64 = "0.22.1"
http = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
url = "2.5"
# `=` 钉在 3.2.0：3.3.0 起改要 `process-wrap ^10`，那一版要求 `windows ^0.62`，依赖图就会分裂成
# 两代 `windows`。解除钉住之前先确认 Tauri 侧已经迁移。
rmcp = { version = "=3.2.0", default-features = false, features = [
    "client",
    "auth",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
] }

[dev-dependencies]
zlogic-mcp = { path = ".", features = ["test-server"] }
zlogic-objects = { path = "../objects" }
tempfile.workspace = true
rmcp = { version = "=3.2.0", default-features = false, features = ["server"] }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "time"] }

[package]
name = "zlogic-codex"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "ChatGPT subscription (Codex) sign-in, token custody, and model discovery"
license.workspace = true

[lints]
workspace = true

[dependencies]
zlogic-credential = { path = "../credential" }
zlogic-llm = { path = "../llm", default-features = false }
zlogic-protocol = { path = "../protocol" }
async-trait.workspace = true
base64 = "0.22.1"
chrono.workspace = true
ring.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "time", "sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

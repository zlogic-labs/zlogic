[package]
# The package is named `zlogic`, not `zlogic-cli`, because that is the name the crate is
# published under on crates.io — `cargo install zlogic` has to resolve to something. The
# `-cli` suffix would read better next to the library crates, but it is not the name anyone
# installs.
name = "zlogic"
edition = "2021"
description = "Open-source AI coding agent and agent harness: a terminal UI wired to the in-process engine."
license.workspace = true
version.workspace = true
repository = "https://github.com/zlogic-labs/zlogic"
homepage = "https://zlogic.run"
documentation = "https://docs.rs/zlogic"
readme = "README.md"
keywords = ["ai", "agent", "tui", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]
# The workspace default is publish = false; this crate opts in. Note what publishing it means:
# what lands on crates.io is the TUI host and the engine libraries, without the closed-source
# daemon that the shipped binary welds in. `zlogic daemon …` falls back to a sibling
# zlogic-daemon binary for source builds; there is no such binary in a cargo install.
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
crossterm.workspace = true
ratatui = "0.29"
unicode-width = "0.2"
anyhow = "1"
fluent-bundle = "0.15"
unic-langid = "0.9"
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "net"] }
# For logging from the exit hook (EngineSession::drop stops all turns); shares the same tracing pipeline as the engine.
tracing.workspace = true

# engine host dependencies (the same crate graph every host links).
zlogic-engine = { path = "../../crates/engine" }
zlogic-protocol = { path = "../../crates/protocol" }
zlogic-config = { path = "../../crates/config" }
zlogic-logging = { path = "../../crates/logging" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

# The command name is zlogic, which the package name already implies — Cargo derives the
# binary name from it. Spelled out so the artifact is not renamed by accident: renaming the
# package changes what `cargo install` produces.
[[bin]]
name = "zlogic"
path = "src/main.rs"
